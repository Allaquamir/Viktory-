  var LEVELS=[
    [0,"Новичок у бортика","Самое время подтянуть теорию. Начните с кроля и вернитесь к вопросам."],
    [4,"Любитель с доской","Основы на месте. Правила и рекорды стоит освежить."],
    [7,"Разрядник","Уверенные знания. До мастера не хватает пары деталей."],
    [10,"Чемпион дорожки","Безупречно. Можно вести тренировки."]
  ];
  var $=function(i){return document.getElementById(i)};
  var i,score,locked,iv;

  function show(id){["start","game","end"].forEach(function(s){$(s).classList.toggle("hidden",s!==id)});var el=$(id);el.classList.remove("in");void el.offsetWidth;el.classList.add("in");window.scrollTo(0,0)}
  function shuffle(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t}return a}
  function setProgress(n){Array.prototype.forEach.call($("seg").children,function(s,k){s.classList.toggle("on",k<n)})}

  function start(){
    score=0;i=0;savedThisRun=false;clearInterval(iv);
    var sg=$("seg");sg.innerHTML="";Q.forEach(function(){sg.appendChild(document.createElement("i"))});
    show("game");render();
  }
  function render(){
    locked=false;
    var d=Q[i];
    $("num").textContent="Вопрос "+(i+1)+" из "+Q.length;
    $("pts").textContent="Верно: "+score;
    $("q").textContent=d.q;
    $("ill").innerHTML='<svg viewBox="0 0 240 140">'+ILL[i]+'</svg>';
    var qc=$("qcard");qc.classList.remove("in");void qc.offsetWidth;qc.classList.add("in");
    setProgress(i);
    $("fact").classList.add("hidden");
    $("next").classList.add("hidden");
    var box=$("opts");box.innerHTML="";
    var idx=shuffle(d.a.map(function(_,k){return k}));
    idx.forEach(function(k,n){
      var b=document.createElement("button");
      b.className="opt";b.type="button";b.style.animationDelay=(n*80+160)+"ms";
      var s=document.createElement("span");s.className="tag";s.textContent="АБВГ".charAt(n);
      var t=document.createElement("span");t.textContent=d.a[k];
      b.appendChild(s);b.appendChild(t);
      b.onclick=function(){pick(b,k===d.c)};
      b.dataset.right=k===d.c?"1":"";
      box.appendChild(b);
    });
  }
  function pick(btn,right){
    if(locked)return;locked=true;
    if(right)score++;
    Array.prototype.forEach.call($("opts").children,function(b){
      b.disabled=true;b.style.animationDelay="0s";
      if(b.dataset.right){b.classList.add("ok");b.firstChild.textContent="✓"}
    });
    if(!right){btn.classList.add("bad");btn.firstChild.textContent="✕"}
    $("pts").textContent="Верно: "+score;
    var f=$("fact");
    f.textContent=(right?"Верно. ":"Не совсем. ")+Q[i].f;
    f.classList.remove("hidden");
    var n=$("next");n.textContent=i===Q.length-1?"Узнать результат":"Дальше";
    n.classList.remove("hidden");
    setProgress(i+1);
    try{if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.HapticFeedback)Telegram.WebApp.HapticFeedback.notificationOccurred(right?"success":"error")}catch(e){}
  }
  function next(){i++;if(i<Q.length)render();else finish()}
  var savedThisRun=false;
  function saveResult(){
    var status=$("saveStatus");
    if(savedThisRun)return;
    savedThisRun=true;
    if(!WORKER_URL || WORKER_URL.indexOf("ВСТАВЬТЕ_URL")===0){
      status.textContent="Результат пока не сохранён: укажите URL Cloudflare Worker в настройках файла.";
      return;
    }
    var tg=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;
    if(!tg || !tg.initData){
      status.textContent="Откройте викторину через Telegram, чтобы сохранить результат.";
      return;
    }
    status.textContent="Сохраняем результат…";
    fetch(WORKER_URL.replace(/\/$/,"")+"/api/result",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({initData:tg.initData,score:score,total:Q.length})
    }).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})
      .then(function(){status.textContent="Результат сохранён в базе данных ✓";})
      .catch(function(){savedThisRun=false;status.textContent="Не удалось сохранить результат. Проверьте подключение и попробуйте пройти викторину ещё раз.";});
  }
  function finish(){
    var lv=LEVELS[0];
    LEVELS.forEach(function(l){if(score>=l[0])lv=l});
    $("title").textContent=lv[1];
    $("desc").textContent=lv[2];
    $("outof").textContent="из "+Q.length;
    $("copied").classList.add("hidden");
    $("saveStatus").textContent="";
    var el=$("final"),arc=$("arc"),c=0;
    el.textContent="0";arc.style.strokeDashoffset=377;
    show("end");
    saveResult();
    void arc.getBoundingClientRect();
    arc.style.strokeDashoffset=377*(1-score/Q.length);
    clearInterval(iv);
    if(score){iv=setInterval(function(){c++;el.textContent=c;if(c>=score)clearInterval(iv)},110)}
  }
  function share(){
    var t="Я набрал(а) "+score+" из "+Q.length+" в викторине про плавание. А вы сможете лучше?";
    var done=function(){$("copied").classList.remove("hidden")};
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,done)}
      else{done()}
    }catch(e){done()}
  }
  $("go").onclick=start;$("next").onclick=next;$("again").onclick=start;$("share").onclick=share;
